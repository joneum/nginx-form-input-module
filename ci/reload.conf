# The part of the reload test that differs per module.  ci/reload.sh sources
# this with $WORK and $PORT already set and then drives the reloads.
#
#     RELOAD_HTTP    directives for the http block, may be empty
#     RELOAD_SERVER  directives for the server block
#     RELOAD_EXPECT  what reload_probe has to print
#     reload_probe   prints what the server answered

RELOAD_HTTP=

RELOAD_SERVER='
        location /probe {
            set_form_input $foo bar;
            echo $foo;
        }'

RELOAD_EXPECT=baz

# The module only has work to do when there is a body to read, so the probe
# posts one.  A plain GET would leave its request handler untouched and the
# reload series would prove nothing about it.
reload_probe() {
	curl -s --max-time 5 \
		-H 'Content-Type: application/x-www-form-urlencoded' \
		--data 'bar=baz' \
		"http://127.0.0.1:$PORT/probe"
}

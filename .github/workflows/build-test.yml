name: Build & Test

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Monday morning, so a new nginx release that breaks the module shows
    # up here and not in somebody's build
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pins:
    name: pins
    runs-on: ubuntu-latest
    # A matrix is read before any step of its own job runs, so the release
    # list has to arrive from an earlier job.  Which releases, and why this
    # module skips the 1.30 line, is written down in .github/versions.env.
    outputs:
      nginx: ${{ steps.read.outputs.nginx }}
      version: ${{ steps.read.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - id: read
        run: .github/scripts/pins.sh >> "$GITHUB_OUTPUT"

  suite:
    name: nginx ${{ matrix.nginx }}
    needs: pins
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        nginx: ${{ fromJSON(needs.pins.outputs.nginx) }}

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Build nginx ${{ matrix.nginx }}
        run: ci/build.sh '${{ matrix.nginx }}' "$HOME/nginx"

      - name: Run the test suite
        run: TEST_NGINX_BINARY="$HOME/nginx/sbin/nginx" prove -r t/

  dynamic:
    name: loadable modules
    needs: pins
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Build every module as a loadable object
        run: ci/build.sh '${{ needs.pins.outputs.version }}' "$HOME/nginx" dynamic

      - name: Run the test suite against the loaded modules
        run: |
          mods=
          for so in "$HOME"/nginx/modules/*.so; do
            mods="$mods $so"
          done
          echo "loading:$mods"
          TEST_NGINX_LOAD_MODULES="$mods" \
            TEST_NGINX_BINARY="$HOME/nginx/sbin/nginx" prove -r t/

  no-array-var:
    name: build without array-var
    needs: pins
    runs-on: ubuntu-latest
    # set_form_input_multi produces a value only array-var-nginx-module
    # can read, so nginx has to refuse the directive in a build without
    # it.  The suite cannot reach that case; it always builds array-var in.

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          test-nginx: 'false'

      - name: Build without array-var-nginx-module
        run: ci/build.sh '${{ needs.pins.outputs.version }}' "$HOME/nginx" no-array-var

      - name: The directive has to be refused, and only that one
        run: ci/check-no-array-var.sh "$HOME/nginx"
